<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typst-Editor by Kong</title>
  </head>

  <body>
    <div id="app">
      <div id="banner" class="banner hidden">
        <span id="banner-text"></span>
        <div class="banner-actions">
          <button id="banner-action" class="btn btn-sm hidden">Action</button>
          <button id="banner-close" class="btn-banner-close" title="Dismiss" aria-label="Dismiss">✕</button>
        </div>
      </div>

      <header id="toolbar" class="toolbar">
        <div class="toolbar-left">
          <button id="btn-sidebar" class="btn btn-icon" title="Toggle Sidebar (Ctrl+B)">☰</button>
          <button id="btn-open-folder" class="btn" title="Open Folder">Open Folder...</button>
          <button id="btn-open" class="btn" title="Open File (Ctrl+O)">Open File...</button>
          <button id="btn-templates" class="btn" title="Template Market">Templates</button>
          <span id="file-name" class="file-name" title="No file open">No file open</span>
        </div>
        <div class="toolbar-right">
          <button id="btn-format" class="btn" title="Format Document (Shift+Alt+F)">Format</button>
          <button id="btn-comment-mode" class="btn" title="Comment mode: select text in the preview to highlight it and add a note" aria-pressed="false">💬 Comment</button>
          <div class="zoom-controls">
            <button id="btn-zoom-out" class="btn btn-sm" title="Zoom Out (Ctrl+-)">−</button>
            <button id="btn-zoom-reset" class="btn btn-sm" title="Reset Zoom (Ctrl+0)">100%</button>
            <button id="btn-zoom-in" class="btn btn-sm" title="Zoom In (Ctrl++)">+</button>
          </div>
          <div class="export-dropdown-wrap">
            <button id="btn-export" class="btn" title="Export PDF (Ctrl+E)">Export</button>
            <button id="btn-export-options" class="btn" style="padding: 3px 6px; border-left: none; border-top-left-radius: 0; border-bottom-left-radius: 0;" title="Export Options">▾</button>
            <div id="export-menu" class="dropdown-menu hidden">
              <button id="btn-export-pdf" class="dropdown-item">Export PDF (.pdf)</button>
              <button id="btn-export-png" class="dropdown-item">Export PNG (.png)</button>
              <button id="btn-export-svg" class="dropdown-item">Export SVG (.svg)</button>
              <button id="btn-export-html" class="dropdown-item">Export HTML (.html)</button>
              <button id="btn-export-tex" class="dropdown-item">Export LaTeX (.tex)</button>
            </div>
          </div>
          <button id="btn-settings" class="btn btn-icon" title="Settings">⚙</button>
        </div>
      </header>

      <main class="workspace">
        <aside id="sidebar" class="sidebar">
          <div class="sidebar-section">
            <div class="sidebar-header">
              <span>Files</span>
              <div class="sidebar-actions">
                <button id="btn-new-file" class="btn btn-sm" title="New File">+ File</button>
                <button id="btn-new-folder" class="btn btn-sm" title="New Folder">+ Folder</button>
              </div>
            </div>
            <div id="file-tree" class="sidebar-tree"></div>
          </div>
          <div class="sidebar-section">
            <div class="sidebar-header">
              <span>Outline</span>
            </div>
            <div id="outline-tree" class="sidebar-tree"></div>
          </div>
          <div class="sidebar-section">
            <div class="sidebar-header">
              <span>Comments</span>
            </div>
            <div id="comments-list" class="sidebar-tree"></div>
          </div>
        </aside>

        <div id="editor" class="editor-pane">
          <div id="editor-welcome" class="editor-welcome">
            <h2 style="margin: 0 0 8px 0; font-size: 20px; font-weight: 600;">Typst-Editor by Kong</h2>
            <p style="color: var(--muted); margin: 0 0 20px 0; font-size: 13.5px;">A fast, standalone desktop editor with live preview for Typst documents.</p>
            <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
              <button id="welcome-btn-open-folder" class="btn btn-primary">Open Folder...</button>
              <button id="welcome-btn-open-file" class="btn">Open File...</button>
              <button id="welcome-btn-templates" class="btn">Explore Templates</button>
            </div>
          </div>
        </div>
        <div id="splitter" class="splitter" role="separator" aria-orientation="vertical" tabindex="0"></div>
        <div class="preview-pane">
          <iframe id="preview" class="preview-frame" title="Preview"></iframe>
        </div>
      </main>

      <div id="problems" class="problems hidden">
        <div class="problems-header">Problems</div>
        <div id="problems-list" class="problems-list"></div>
      </div>

      <footer class="statusbar">
        <span id="status-state" class="status-item">Ready</span>
        <span class="spacer"></span>
        <span id="status-pos" class="status-item">Ln 1, Col 1</span>
        <span id="status-typst-ver" class="status-item">Typst 0.15.1</span>
      </footer>
    </div>

    <!-- Settings Modal -->
    <div id="modal-settings" class="modal-backdrop hidden">
      <div class="modal-card">
        <h3 class="modal-title">Settings</h3>
        <div class="modal-body">
          <div class="form-group">
            <label for="setting-theme">Theme</label>
            <select id="setting-theme" class="form-select">
              <option value="system">System Default</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </div>
          <div class="form-group">
            <label for="setting-fontsize">Editor Font Size (px)</label>
            <input id="setting-fontsize" type="number" min="10" max="32" class="form-input" value="13.5" />
          </div>
          <div class="form-group" style="flex-direction: row; align-items: center; gap: 8px;">
            <input id="setting-autosave" type="checkbox" checked />
            <label for="setting-autosave" style="margin: 0; cursor: pointer;">Enable Autosave (1s idle)</label>
          </div>
          <div class="form-group" style="flex-direction: row; align-items: center; gap: 8px;">
            <input id="setting-wordwrap" type="checkbox" checked />
            <label for="setting-wordwrap" style="margin: 0; cursor: pointer;">Enable Text Wrapping</label>
          </div>
          <div class="form-group">
            <label for="setting-typst-path">Custom Typst Path (optional)</label>
            <input id="setting-typst-path" type="text" class="form-input" placeholder="e.g. C:\Program Files\Typst\typst.exe" />
            <small style="color: var(--muted); margin-top: 4px;">Leave empty to use system <code>typst</code> on PATH</small>
          </div>
          <div class="form-group" style="border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px;">
            <div style="display: flex; align-items: center; justify-content: space-between;">
              <div>
                <strong style="font-size: 13px;">Software Update</strong>
                <div id="update-status-text" style="color: var(--muted); font-size: 12px;">Typst-Editor by Kong v0.1.0</div>
              </div>
              <button id="btn-check-updates" class="btn btn-sm">Check for Updates</button>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button id="btn-settings-cancel" class="btn">Cancel</button>
          <button id="btn-settings-save" class="btn btn-primary">Save Settings</button>
        </div>
      </div>
    </div>

    <!-- Quick Open Modal -->
    <div id="modal-quick-open" class="modal-backdrop hidden">
      <div class="quick-open-modal">
        <input id="quick-open-input" class="quick-open-input" type="text" placeholder="Type a file name to open..." />
        <div id="quick-open-list" class="quick-open-list"></div>
      </div>
    </div>

    <!-- Template Market View (Full-window) -->
    <div id="template-market-view" class="template-market-view hidden">
      <header class="template-market-header">
        <button id="btn-template-back" class="btn">← Back</button>
        <strong style="font-size: 15px;">Templates</strong>
        <input id="template-search" class="template-search-input" type="text" placeholder="🔍 Search templates..." />
        <div class="spacer"></div>
        <div id="template-pills" class="template-pills">
          <button class="pill-btn active" data-category="All">All</button>
          <button class="pill-btn" data-category="Thesis">Thesis</button>
          <button class="pill-btn" data-category="Paper">Paper</button>
          <button class="pill-btn" data-category="Report">Report</button>
          <button class="pill-btn" data-category="CV">CV</button>
          <button class="pill-btn" data-category="Slides">Slides</button>
          <button class="pill-btn" data-category="My templates">My templates</button>
        </div>
        <button id="btn-save-as-template" class="btn btn-sm" title="Save current project to My templates">Save as template</button>
      </header>
      <div id="template-grid" class="template-grid"></div>
    </div>

    <!-- Template Details Modal -->
    <div id="modal-template-details" class="modal-backdrop hidden">
      <div class="modal-card">
        <h3 id="template-detail-title" class="modal-title">Template Details</h3>
        <div class="modal-body">
          <img id="template-detail-preview" class="template-detail-banner hidden" alt="Template Preview" />
          <div id="template-detail-meta" style="color: var(--muted); font-size: 12px; margin-bottom: 8px;"></div>
          <div id="template-detail-author" style="color: var(--ink); font-size: 12.5px; margin-bottom: 8px;"></div>
          <p id="template-detail-desc" style="font-size: 13px; line-height: 1.5; margin: 0;"></p>
        </div>
        <div class="modal-footer">
          <button id="btn-template-detail-close" class="btn">Close</button>
          <button id="btn-template-detail-use" class="btn btn-primary">Use Template</button>
        </div>
      </div>
    </div>

    <!-- Image Viewer Modal -->
    <div id="modal-image" class="modal-backdrop hidden">
      <div class="modal-card image-viewer-card">
        <h3 id="image-viewer-title" class="modal-title"></h3>
        <img id="image-viewer-img" class="image-viewer-img" alt="" />
        <div class="modal-footer">
          <button id="btn-image-close" class="btn">Close</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
